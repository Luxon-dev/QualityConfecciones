<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quality Confecciones</title>
  
  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #e6c875 0%, #d4af37 50%, #997a15 100%);
      --dark-bg: #0b0d10;
      --glass-bg: rgba(18, 22, 28, 0.85);
      --glass-border: rgba(212, 175, 55, 0.3);
      --input-bg: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* VIDEO DE FONDO */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.3) contrast(1.1) blur(4px);
      transform: scale(1.03);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(11, 13, 16, 0.3) 0%, rgba(11, 13, 16, 0.9) 100%);
      z-index: 2;
    }

    /* CARD PRINCIPAL */
    .main-card {
      position: relative;
      z-index: 3;
      width: 92%;
      max-width: 650px;
      padding: 35px 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                  0 0 40px rgba(212, 175, 55, 0.15);
      text-align: center;
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 20px;
    }

    /* PESTAÑAS (TABS) */
    .tab-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
      background: rgba(0, 0, 0, 0.3);
      padding: 5px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      background: transparent;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--gold-gradient);
      color: #000;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    /* SECCIONES DINÁMICAS */
    .tab-content {
      display: none;
      animation: fadeInTab 0.4s ease forwards;
    }

    .tab-content.active {
      display: block;
    }

    /* CONTENEDOR DE VIDEO */
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* FORMULARIO MODERNO */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--gold-primary);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input {
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.3s ease;
    }

    .form-group input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    /* BOTÓN ACCIÓN */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #0c0e12;
      background: var(--gold-gradient);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(212, 175, 55, 0.5);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInTab {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 580px) {
      .form-grid { grid-template-columns: 1fr; }
      .main-card { padding: 25px 18px; }
    }
  </style>
</head>
<body>

  <!-- Video de Fondo -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="video_1.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <!-- Contenedor Principal -->
  <main class="main-card">
    
    <h1 class="brand-title">Quality</h1>
    <p class="brand-subtitle">Confecciones</p>

    <!-- Pestañas -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('video-tab', this)">Presentación</button>
      <button class="tab-btn" onclick="switchTab('form-tab', this)">Registrarse</button>
    </div>

    <!-- Pestaña Video -->
    <div id="video-tab" class="tab-content active">
      <div class="video-box">
        <video autoplay muted loop playsinline>
          <source src="video_1.mp4" type="video/mp4" />
        </video>
      </div>
      <a href="https://qualiconf-xzmwn5at.manus.space/" class="btn-action" target="_blank" rel="noopener">
        Ver Página de Inicio &rarr;
      </a>
    </div>

    <!-- Pestaña Formulario de Registro -->
    <div id="form-tab" class="tab-content">
      <form action="https://api.web3forms.com/submit" method="POST">
        <!-- Clave de envío vinculada a tu mail -->
        <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE" />
        <input type="hidden" name="subject" value="Nuevo Registro - Quality Confecciones" />
        <input type="hidden" name="from_name" value="Quality Confecciones Web" />

        <div class="form-grid">
          <div class="form-group">
            <label>Nombre y Apellido</label>
            <input type="text" name="Nombre" placeholder="Juan Pérez" required />
          </div>
          <div class="form-group">
            <label>Teléfono / WhatsApp</label>
            <input type="tel" name="Telefono" placeholder="11 1234 5678" required />
          </div>
          <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" name="Email" placeholder="usuario@email.com" required />
          </div>
          <div class="form-group">
            <label>Localidad / Ciudad</label>
            <input type="text" name="Localidad" placeholder="Buenos Aires" required />
          </div>
        </div>
        <button type="submit" class="btn-action">
          Enviar Registro
        </button>
      </form>
    </div>

  </main>

  <script>
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }
  </script>

</body>
</html>
