<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quality Confecciones</title>
  
  <!-- Tipografía moderna Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES DE COLOR INSPIRADAS EN LA IMAGEN */
    :root {
      --bg-dark: #0f141a;
      --card-bg: rgba(22, 29, 38, 0.75);
      --accent-gold: #d99b26;
      --accent-gold-hover: #f1b238;
      --text-light: #f8fafc;
      --text-muted: #cbd5e1;
      --border-color: rgba(217, 155, 38, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* CONTENEDOR PRINCIPAL / CARD CENTRADA */
    .wrapper {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 520px;
      padding: 32px 24px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(217, 155, 38, 0.1);
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    /* MARCA Y ENCABEZADO */
    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 600;
      color: var(--text-light);
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      font-weight: 300;
      font-style: italic;
      color: var(--accent-gold);
      letter-spacing: 2px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* FRAME DEL VIDEO */
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
      margin-bottom: 28px;
      background: #000;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* BOTÓN LLAMATIVO */
    .btn-main {
      display: inline-block;
      width: 100%;
      padding: 16px 28px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #0f141a;
      background: linear-gradient(135deg, #f3c358 0%, var(--accent-gold) 100%);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(217, 155, 38, 0.4);
      transition: all 0.3s ease;
    }

    .btn-main:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, #ffda73 0%, var(--accent-gold-hover) 100%);
      box-shadow: 0 12px 30px rgba(217, 155, 38, 0.6);
    }

    .btn-main:active {
      transform: translateY(-1px);
    }

    /* ANIMACIÓN DE ENTRADA */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ADAPTABILIDAD MOBILE */
    @media (max-width: 480px) {
      .wrapper {
        padding: 24px 18px;
      }
      .brand-title {
        font-size: 2rem;
      }
      .btn-main {
        font-size: 0.9rem;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>

  <main class="wrapper">
    <!-- Título / Logotipo -->
    <h1 class="brand-title">Quality</h1>
    <p class="brand-subtitle">Confecciones</p>

    <!-- Contenedor del video en marco profesional -->
    <div class="video-container">
      <video autoplay muted loop playsinline poster="">
        <source src="video_1.mp4" type="video/mp4" />
        Tu navegador no soporta el formato de video.
      </video>
    </div>

    <!-- Botón de redirección -->
    <a href="https://qualiconf-xzmwn5at.manus.space/" class="btn-main" target="_blank" rel="noopener">
      Ver página de inicio
    </a>
  </main>

</body>
</html>
